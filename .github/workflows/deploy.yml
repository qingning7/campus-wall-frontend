name: Frontend checks and deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Build production site
        run: npm run build
        env:
          VITE_API_BASE_URL: /
      - run: tar -czf frontend.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend.tar.gz
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Reject a superseded commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: frontend
      - name: Upload and deploy
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          release="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target="campusdeploy@$DEPLOY_HOST"
          opts=(-i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          scp "${opts[@]}" frontend.tar.gz "$target:/opt/campus-wall/deploy/incoming/frontend-$release.tar.gz"
          ssh "${opts[@]}" "$target" "/usr/local/bin/campus-wall-deploy frontend $release"
